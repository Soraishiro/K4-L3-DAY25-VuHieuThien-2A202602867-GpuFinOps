name: GPU FinOps regression checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate missions and verify outputs
        run: python verify.py
      - name: Regression suite
        run: python -m pytest -q
      - name: Commit deterministic generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/report.md outputs/focus_export.csv outputs/savings.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh reproducible FinOps reports [skip ci]"
            git push
          fi
