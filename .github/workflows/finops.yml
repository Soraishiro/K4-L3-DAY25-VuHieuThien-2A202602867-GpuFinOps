name: GPU FinOps regression checks
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate missions and generate reports
        run: python verify.py
      - name: Regression suite
        run: python -m pytest -q
      - name: Upload generated reports (no repository push)
        uses: actions/upload-artifact@v4
        with:
          name: gpu-finops-generated-results
          path: |
            outputs/report.md
            outputs/savings.png
            outputs/focus_export.csv
          if-no-files-found: error
          retention-days: 30
